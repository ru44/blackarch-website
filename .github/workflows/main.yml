name: main-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer run for the same pull request replaces the running one. Runs on main
# are never cancelled, so a deploy always finishes.
concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      # Full history: VitePress reads it for the "last updated" dates.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check generated language pages are up to date
        run: |
          pnpm gen:locales
          git diff --exit-code -- src || {
            echo "::error::Language pages are out of date. Run 'pnpm gen:locales' and commit the result."
            exit 1
          }

      - name: Build
        run: pnpm build

      # The site that gets deployed is the one this job just checked and built.
      - name: Upload the site for deployment
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/.vitepress/dist

  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # Only pushes to main deploy. This job checks out and runs no code: it
  # publishes the artifact from the build job, and is the only job with
  # permission to write to GitHub Pages.
  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
